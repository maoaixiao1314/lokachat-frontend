# The page and the twin have to look like one origin.
#
# src/api/twin.ts refuses a cross-origin base on purpose -- a browser holding the twin's
# shared secret is a browser that can be asked for it -- so the twin is reached at /api/twin
# on this same host and the prefix is stripped here, exactly as vite's dev proxy does it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reading a repository and taking notes on it is a model call, sometimes several.
    # nginx's default 60s cuts those off mid-answer and the page shows a failure for work
    # that was going to succeed.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The trailing slash on proxy_pass is what strips /api/twin from the path.
    location /api/twin/ {
        proxy_pass http://host.docker.internal:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If the twin is started with LOKA_TWIN_TOKEN set, the secret belongs here and not
        # in the page. Uncomment and fill in to match:
        # proxy_set_header Authorization "Bearer PUT_THE_SAME_TOKEN_HERE";
    }

    # The rest of /api is the account and points backend. It is not needed for the twin
    # screens; without it running, this simply returns 502 and /twin is unaffected.
    location /api/ {
        proxy_pass http://host.docker.internal:8780/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # A single-page app: every route is served the same document and resolved in the browser.
    # Without this, opening /twin directly -- which is the whole demo -- is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
